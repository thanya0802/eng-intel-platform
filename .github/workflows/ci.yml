name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Build data + index, then eval gate
        run: |
          python data/generate.py
          python -m engintel.cli reset
          python -m engintel.cli ingest
          python -m engintel.cli index
          python evals/run_evals.py --gate
  # deploy job (Cloud Run via Workload Identity Federation) is added in the GCP phase
